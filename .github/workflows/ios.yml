name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift test (FishingCore)
        working-directory: Packages/FishingCore
        run: swift test

  build-simulator:
    runs-on: macos-latest
    needs: logic-tests
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FishingIdle.xcodeproj \
            -scheme FishingIdle \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Run in simulator & screenshot
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro Max' in x['name']][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name "FishingIdle.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          # App Store 截图风格的状态栏
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p screens
          # 首次启动：新手引导
          xcrun simctl launch "$UDID" com.example.fishingidle
          sleep 12
          xcrun simctl io "$UDID" screenshot screens/onboarding.png
          xcrun simctl terminate "$UDID" com.example.fishingidle || true
          xcrun simctl launch "$UDID" com.example.fishingidle -skipOnboarding -AppleLanguages "(zh-Hans)"
          sleep 15
          xcrun simctl io "$UDID" screenshot screens/launch.png
          sleep 20
          xcrun simctl io "$UDID" screenshot screens/after35s.png
          # 演示存档 + 各分页截图
          # 0 船长 1 渔具 2 海图 3 图鉴 4 鱼缸
          for TAB in 0 1 2 3 4; do
            xcrun simctl terminate "$UDID" com.example.fishingidle || true
            xcrun simctl launch "$UDID" com.example.fishingidle -demo -tab $TAB -AppleLanguages "(zh-Hans)"
            sleep 12
            xcrun simctl io "$UDID" screenshot screens/demo-tab$TAB.png
          done
          # 设置页、离线收益卡片
          for EXTRA in settings offline; do
            xcrun simctl terminate "$UDID" com.example.fishingidle || true
            xcrun simctl launch "$UDID" com.example.fishingidle -demo -tab 0 -$EXTRA -AppleLanguages "(zh-Hans)"
            sleep 12
            xcrun simctl io "$UDID" screenshot screens/demo-$EXTRA.png
          done
          # 英文界面
          xcrun simctl terminate "$UDID" com.example.fishingidle || true
          xcrun simctl launch "$UDID" com.example.fishingidle -demo -tab 0 -AppleLanguages "(en)" -AppleLocale en_US
          sleep 12
          xcrun simctl io "$UDID" screenshot screens/demo-en.png
          # 小百科：已解锁与未解锁条目
          for FISH in sardine coelacanth; do
            xcrun simctl terminate "$UDID" com.example.fishingidle || true
            xcrun simctl launch "$UDID" com.example.fishingidle -demo -tab 3 -ency $FISH -AppleLanguages "(zh-Hans)"
            sleep 12
            xcrun simctl io "$UDID" screenshot screens/ency-$FISH.png
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: screens/

