name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift test (FishingCore)
        working-directory: Packages/FishingCore
        run: swift test

  build-simulator:
    runs-on: macos-latest
    needs: logic-tests
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FishingIdle.xcodeproj \
            -scheme FishingIdle \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Run in simulator & screenshot
        timeout-minutes: 24
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro Max' in x['name']][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name "FishingIdle.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          # App Store 截图风格的状态栏
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p screens
          shot () { NAME=$1; shift; xcrun simctl terminate "$UDID" com.example.fishingidle || true; xcrun simctl launch "$UDID" com.example.fishingidle "$@"; sleep 12; xcrun simctl io "$UDID" screenshot screens/$NAME.png; }
          ZH='-AppleLanguages (zh-Hans)'
          EN='-AppleLanguages (en) -AppleLocale en_US'
          shot onboarding $ZH
          shot naming -demo -naming $ZH
          shot main-dusk -demo -hour 18 -weather sunny $ZH
          shot main-day -demo -hour 11 -weather sunny $ZH
          shot main-night -demo -hour 23 -weather sunny $ZH
          shot main-storm -demo -hour 15 -weather storm $ZH
          shot main-fog -demo -hour 8 -weather fog $ZH
          shot main-polar -demo -hour 18 -ocean arctic -weather ice $ZH
          shot main-port -demo -hour 18 -port $ZH
          shot main-sailing -demo -hour 18 -sailing $ZH
          for P in chart gear dock codex tank log hold; do shot panel-$P -demo -hour 18 -panel $P $ZH; done
          shot minigame -demo -hour 18 -minigame $ZH
          shot offline -demo -hour 18 -offline $ZH
          shot settings -demo -settings $ZH
          shot ency-sardine -demo -ency sardine $ZH
          shot en-onboarding $EN
          shot en-main-dusk -demo -hour 18 $EN
          for P in chart dock hold log; do shot en-panel-$P -demo -hour 18 -panel $P $EN; done
          shot en-minigame -demo -hour 18 -minigame $EN
          shot en-offline -demo -hour 18 -offline $EN
      - name: Record gameplay video (zh)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for v in d.values() for x in v][0])")
          mkdir -p video
          xcrun simctl terminate "$UDID" com.example.fishingidle || true
          xcrun simctl launch "$UDID" com.example.fishingidle -demo -tour -hour 18 -AppleLanguages "(zh-Hans)"
          sleep 3
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force video/gameplay-v6-zh.mov &
          REC=$!
          sleep 88
          kill -INT $REC
          wait $REC || true
          ls -la video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-video
          path: video/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: screens/

