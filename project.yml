name: FishingIdle
options:
  bundleIdPrefix: com.example.fishingidle
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FishingCore:
    path: Packages/FishingCore
targets:
  FishingIdle:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: FishingCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 船长别回来
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIRequiredDeviceCapabilities: [metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fishingidle   # TODO: 换成你自己的 Bundle ID
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # TODO: 填入 Apple Team ID
schemes:
  FishingIdle:
    build:
      targets:
        FishingIdle: all
    run:
      config: Debug
      storeKitConfiguration: App/FishingIdle.storekit
    test:
      targets: []
